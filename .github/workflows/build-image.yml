name: build-image

# Constrói a imagem deste fork e publica no GHCR (sempre) e no Docker Hub
# (só se os secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN existirem).
#
# O GHCR não precisa de configuração nenhuma — usa o GITHUB_TOKEN do próprio
# workflow. Para o Docker Hub, crie um Access Token em
# hub.docker.com > Account Settings > Personal access tokens e salve em
# Settings > Secrets and variables > Actions deste repositório como
# DOCKERHUB_USERNAME e DOCKERHUB_TOKEN.
#
# NOTA: o contexto `secrets` NÃO pode ser usado em `if:` de step — por isso os
# valores são expostos como `env` no nível do job e as condições olham `env`.

on:
  push:
    branches:
      - '2.3.7-baileys-rc13'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no Docker Hub (opcional)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Monta a lista de tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          BASE="2.3.7-baileys-rc13"
          TAGS="ghcr.io/$OWNER/evolution-api:$BASE"
          TAGS="$TAGS,ghcr.io/$OWNER/evolution-api:$BASE-$SHA_SHORT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="$TAGS,$DOCKERHUB_USERNAME/evolution-api:$BASE"
            TAGS="$TAGS,$DOCKERHUB_USERNAME/evolution-api:$BASE-$SHA_SHORT"
          fi
          echo "list=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          # O servidor é x86_64. Acrescente linux/arm64 se precisar — dobra o
          # tempo de build, então não vale por padrão.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
